# CONFIG SERVICE

# Server Configuration
server:
  port: ${CONFIG_SERVICE_PORT:8085}

# Spring Configuration
spring:

  # Environment Variables Configuration
  config:
    import: optional:file:.env[.properties]

  # Native Mode Configuration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
    group:
      dev: native
      prod: native

  # Application Configuration
  application:
    name: config-service

  # Cloud Configuration
  cloud:
    # Registration with Eureka
    discovery:
      enabled: true

    # Config Server - native mode (local folder)
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:classpath:/config-repo}
        health:
          enabled: false

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.restobook.configservice: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.cloud.config: ${LOG_LEVEL_CONFIG:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/config-service.log}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
