# CONFIGURATION PARTAGÉE - TOUS LES SERVICES

# Spring Configuration
spring:
  # Discovery Configuration
  cloud:
    discovery:
      enabled: true

  # JPA Default Configuration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Eureka Default Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Logging Default Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO

# Actuator Default Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
