# BOOKING SERVICE - Profil PROD

# Spring
spring:
  # Database
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:booking_db}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# URLs inter-services (réseau Docker)
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://restaurant-service:8082}

# Booking
booking:
  max-days-advance: 7
  cancellation-hours: 2

# Logging
logging:
  level:
    com.restobook.bookingservice: INFO
