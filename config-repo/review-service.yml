# REVIEW SERVICE - Configuration de base

# Server Configuration
server:
  port: ${REVIEW_SERVICE_PORT:8084}

# Spring Configuration
spring:
  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:review_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Services Configuration (appels inter-services)
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}

# Review Configuration
review:
  min-rating: ${REVIEW_MIN_RATING:1}
  max-rating: ${REVIEW_MAX_RATING:5}
  min-comment-length: ${REVIEW_MIN_COMMENT_LENGTH:0}
  max-comment-length: ${REVIEW_MAX_COMMENT_LENGTH:1000}

# Logging Configuration
logging:
  level:
    com.restobook.reviewservice: DEBUG
  file:
    name: logs/review-service.log

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
