# RESTAURANT SERVICE - Configuration de base

# Server Configuration
server:
  port: ${RESTAURANT_SERVICE_PORT:8082}

# Spring Configuration
spring:
  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Services Configuration
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Logging Configuration
logging:
  level:
    com.restobook.restaurantservice: DEBUG
  file:
    name: logs/restaurant-service.log

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
