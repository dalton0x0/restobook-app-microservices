# GATEWAY SERVICE - Profil PROD

# Spring
spring:
  cloud:
    gateway:
      server:
        webflux:
          # CORS
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}
                allow-credentials: true

# Logging
logging:
  level:
    com.restobook.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN
