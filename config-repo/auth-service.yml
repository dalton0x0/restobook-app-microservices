# AUTH SERVICE - Configuration de base

# Server Configuration
server:
  port: ${AUTH_SERVICE_PORT:8081}

# Spring Configuration
spring:
  # Database Configuration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Hibernate Configuration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dlHePwBFzUNH8scVQVDfVtenkkKOwvnXnnY26MtramBC4tKvWhrl4UN7SlRlgoQg5WFl9WMBCJKt0z5ilqrxZm}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Logging Configuration
logging:
  level:
    com.restobook.authservice: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/auth-service.log

# Token cleanup configuration
token:
  cleanup:
    cron: ${TOKEN_CLEANUP_CRON:0 0 2 * * ?}

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Admin Account Configuration
admin:
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:Password123!}
