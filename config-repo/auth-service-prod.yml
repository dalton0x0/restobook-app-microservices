# AUTH SERVICE - Profil PROD

# Spring
spring:
  # Database
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# Logging
logging:
  level:
    com.restobook.authservice: INFO
    org.springframework.security: WARN

# Admin
admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
